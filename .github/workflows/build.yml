name: Build Windows exe

on:
  push:
  workflow_dispatch:   # also lets you start a build by hand from the Actions tab

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Configure (this downloads raylib automatically)
        run: cmake -S . -B build "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build
        run: cmake --build build --config Release

      - name: Save the game as a downloadable file
        uses: actions/upload-artifact@v4
        with:
          name: BoxGame-windows
          path: build/Release/BoxGame.exe
          if-no-files-found: error
