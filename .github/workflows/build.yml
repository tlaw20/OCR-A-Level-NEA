name: Build Windows exe

on:
  push:
  workflow_dispatch:   # also lets you start a build by hand from the Actions tab

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Configure (this downloads raylib automatically)
        run: cmake -S . -B build "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build
        run: cmake --build build --config Release

      - name: Gather the game files (exe + assets folder)
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item build/Release/BoxGame.exe dist/
          Copy-Item -Recurse assets dist/assets

      - name: Save the game as a downloadable file
        uses: actions/upload-artifact@v4
        with:
          name: BoxGame-windows
          path: dist
          if-no-files-found: error